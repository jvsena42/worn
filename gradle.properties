#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
# Required bypass: composeApp uses com.android.application + Kotlin Multiplatform,
# which AGP 9 only permits with these two flags. The clean fix is to move the
# application plugin into a separate non-KMP subproject (kotl.in/kmp-project-structure-migration).
android.builtInKotlin=false
android.newDsl=false