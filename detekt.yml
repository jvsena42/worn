naming:
  FunctionNaming:
    # Allow PascalCase for Composable functions
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
  MatchingDeclarationName:
    # expect/actual files use Platform.android.kt / Platform.ios.kt naming
    active: false

complexity:
  TooManyFunctions:
    # Preview composables inflate count but are not real logic. PhonePreview/TabletPreview are the
    # project's multipreview annotations (see ui/theme/WornPreviews.kt) — detekt matches on the
    # annotation name written at the call site, so the aliases have to be listed too.
    ignoreAnnotatedFunctions: ['Preview', 'PhonePreview', 'TabletPreview']
  LongParameterList:
    # Composable functions pass many state + callback params with defaults
    ignoreDefaultParameters: true
  LongMethod:
    # Composable functions build UI trees that are declarative and linear;
    # the default 60-line limit is too tight for screens with multiple sections
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    active: false
  WildcardImport:
    active: false
  MaxLineLength:
    maxLineLength: 120
  NewLineAtEndOfFile:
    active: true
  UnusedParameter:
    # Compose conventions: `modifier` is always accepted; `onTabSelected` is a
    # navigation callback passed uniformly to all screens even if not yet wired
    allowedNames: 'modifier|onTabSelected'
